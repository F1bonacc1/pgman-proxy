# Integration-test topology for pgman-proxy.
#
# 3 peers + 1 NATS server. Each peer is a single container running
# pgman-proxy AS PID 1 with a colocated Postgres 17 instance under its
# control (pgman-proxy embeds the pg-manager engine, which itself owns
# initdb / pg_basebackup / pg_ctl). The compose file is reachable only
# through the per-project Docker network and from the host via the
# explicit port bindings below; the host bindings make psql probing
# from Go integration tests trivial.
#
# Usage (handled automatically by tests/integration/compose_main_test.go):
#
#   docker compose \
#     -p pgman-proxy-it-<run-id> \
#     -f tests/integration/docker-compose.test.yml \
#     up -d --build --wait
#
# The Dockerfile build context is the repository's parent directory so
# the image build can `COPY` both pg-manager (sibling) and pgman-proxy
# (self) into a single Go module graph honouring the `replace` directive
# in pgman-proxy/go.mod.

# Feature 002: the external `nats` service has been removed. Each peer
# embeds a NATS server in-process (specs/002-embedded-nats-cluster/).
# Routes mesh on TCP/6222 between peer containers.

services:
  node-a:
    build:
      context: ../../..
      dockerfile: pgman-proxy/tests/integration/Dockerfile
    image: pgman-proxy-it:latest
    environment:
      <<: &cluster_common
        # Feature 002 / FR-011a: declared_size >= 1 is required; >1
        # triggers the cluster-coordination contract (route_peers,
        # jetstream_dir, routes_listen). The credential + plaintext-
        # explicit-ack pair is needed because the routes mesh binds
        # on a non-loopback interface inside the container.
        PGMAN_PROXY_CLUSTER_DECLARED_SIZE: "3"
        PGMAN_PROXY_CLUSTER_USERNAME: pgman-proxy-it
        PGMAN_PROXY_CLUSTER_PASSWORD_ENV: PGMAN_CLUSTER_PASSWORD
        PGMAN_CLUSTER_PASSWORD: integration-test-cluster-secret-32b
        PGMAN_PROXY_CLUSTER_TLS_PLAINTEXT_EXPLICIT_ACK: "true"
        PGMAN_PROXY_CLUSTER_CLIENT_LISTEN_PORT: "4222"
        PGMAN_PROXY_CLUSTER_ROUTES_LISTEN_PORT: "6222"
        PGMAN_PROXY_CLUSTER_JETSTREAM_DIR: /var/lib/postgresql/jetstream
        PGMAN_PROXY_PROXY_LISTEN_ADDR: 0.0.0.0:6432
        PGMAN_PROXY_OBS_HEALTH_ADDR: 0.0.0.0:9090
        PGMAN_PROXY_POSTGRES_BIN_DIR: /usr/lib/postgresql/17/bin
        PGMAN_PROXY_POSTGRES_DATA_DIR: /var/lib/postgresql/data
        PGMAN_PROXY_POSTGRES_LOCAL_DSN_ENV: LOCAL_DSN
        LOCAL_DSN: "host=/var/run/postgresql user=postgres sslmode=disable"
        PGMAN_PROXY_OBS_LOG_LEVEL: info
        # Failover posture for the suite. The zz_failover test SIGKILLs
        # the real primary: (a) tightened detection + delay so SC-002's
        # 45s leader-loss-to-first-write budget is measurable (production
        # defaults are 2s×3 liveness + 30s delay — deliberately slower);
        # (b) the Gap-O recovery toggles so the deposed primary rejoins
        # as a standby instead of parking as a divergence fence forever
        # (they default to false = fail-closed for production).
        # FAILOVER_DELAY 2s: operations that take the primary's
        # postgres down briefly ON PURPOSE (upgrade-execute, managed
        # restart — sub-second) stay well under the 3×1s detection +
        # 2s delay ≈ 5s auto-failover threshold. Deliberately NOT
        # tightened below this: the nightly suite runs on shared
        # GitHub-hosted runners where more aggressive timers risk
        # spurious failovers under load — a 500ms interval also
        # quadruples the reconciler-tick rate, which is what sampled
        # the sub-tick promote window behind the false postgres_crashed
        # park (fixed upstream via the two-tick debounce; the 1s
        # interval is defense-in-depth). Measured leader-loss-to-
        # first-write with this posture: ~7s fast path, 11-17s when
        # the embedded-NATS KV leader dies with the primary — inside
        # the 45s SC-002 budget either way.
        PGMAN_PROXY_POLICY_LIVENESS_INTERVAL: 1s
        PGMAN_PROXY_POLICY_FAILOVER_DELAY: 2s
        PGMAN_PROXY_POLICY_AUTO_DEMOTE_ENABLED: "true"
        PGMAN_PROXY_POLICY_AUTO_REBOOTSTRAP_ENABLED: "true"
        # Auto-rebootstrap timing, tightened for the test rig (the
        # loader comment blesses exactly this: "chaos rigs tighten the
        # cooldown + persistence window"). Left unset these fall back
        # to production patience — 5m persistence window, 1h cooldown.
        # Nightly run 30243549323: after a switchover's timeline
        # switch, the uninvolved standby's WAL source went stale and
        # the cluster ran degraded (1 of 2 standbys streaming) for the
        # full 5m window, longer than any test-scale convergence
        # budget (the upgrade suite's quiescence barrier allows 3m).
        # 30s window: a genuinely stale standby heals in ~40s, while
        # deliberate brief primary outages (upgrade-execute restart,
        # sub-10s) clear the condition long before it persists. 60s
        # cooldown: the suite runs several disruptive tests back to
        # back; a same-condition 1h cooldown would park a twice-stale
        # node in degraded state for the rest of the run.
        PGMAN_PROXY_POLICY_AUTO_REBOOTSTRAP_PERSISTENCE_WINDOW: 30s
        PGMAN_PROXY_POLICY_AUTO_REBOOTSTRAP_COOLDOWN: 60s
        # Leadership lease TTL (default 5s): a SIGKILLed leader's lease
        # evicts after ~1.5×TTL, which is serial with failure detection
        # in the unplanned-failover pipeline — 1s keeps the SC-002
        # budget comfortable without renewal chatter so tight it flakes
        # on loaded CI runners (500ms TTL = 250ms renewals; one missed
        # renewal under load and a healthy leader loses its lease).
        PGMAN_PROXY_CLUSTER_LEASE_TTL: 1s
        # Validation requires a control-plane token source even when the
        # control-plane HTTP server is not yet built (Phase 5). The
        # placeholder value is harmless until US4 wires the listener.
        PGMAN_PROXY_CONTROL_AUTH_TOKEN_ENV: PGMAN_PROXY_CONTROL_TOKEN
        PGMAN_PROXY_CONTROL_TOKEN: integration-test-token
        # LCM control plane (FR-021..FR-034). Bound on all interfaces so
        # `docker compose exec curl http://127.0.0.1:9091/...` works from
        # inside the container; plaintext-ack is required because the
        # bind isn't loopback (FR-033). Test-only — production deploys
        # MUST configure TLS.
        PGMAN_PROXY_CONTROL_LISTEN_ADDR: 0.0.0.0:9091
        PGMAN_PROXY_CONTROL_TLS_PLAINTEXT_EXPLICIT_ACK: "true"
        # Test-only HBA / postgresql.conf scaffolding so peers can stream
        # replication on the compose network (DEMO ONLY — never use trust
        # auth in production). The leader's PostInitDB hook applies these.
        PGMAN_PROXY_POSTGRES_HBA_EXTRAS: "host replication all 0.0.0.0/0 trust\nhost all         all 0.0.0.0/0 trust"
        # restore_command must be SET for pg_rewind --restore-target-wal
        # to even start (a demoted ex-primary rewinds onto the new
        # timeline; without this the node wedges down with `pg_rewind:
        # "restore_command" is not set in the target cluster`). There is
        # no WAL archive in this harness — `false` is never actually
        # invoked because wal_keep_size retains every needed segment
        # locally on a test-sized cluster.
        PGMAN_PROXY_POSTGRES_CONF_EXTRAS: "wal_keep_size = 128MB\nrestore_command = 'false'"
        PGMAN_PROXY_CLUSTER_ID: pgman-proxy-it
        PGMAN_PROXY_PEERS: node-a,node-b,node-c
      PGMAN_PROXY_NODE_ID: node-a
      PGMAN_PROXY_CLUSTER_ROUTE_PEERS: node-b:6222,node-c:6222
      # LOCAL_PG_ADDR overrides pg-manager's default of 127.0.0.1:5432
      # for the proxy → local-PG dial. The stock postgres image's
      # pg_hba.conf treats 127.0.0.1/32 as scram-sha-256 (matched
      # BEFORE the trust extras we append), so leaving this unset
      # makes the proxy demand a password that no client supplies.
      # Using the docker-network alias makes the dial source-IP fall
      # to the catch-all 0.0.0.0/0 trust line. See the doc comment on
      # config.PostgresConfig.LocalPGAddr.
      PGMAN_PROXY_POSTGRES_LOCAL_PG_ADDR: node-a:5432
    ports:
      - "16432:6432"
      - "19090:9090"

  node-b:
    image: pgman-proxy-it:latest
    environment:
      <<: *cluster_common
      PGMAN_PROXY_NODE_ID: node-b
      PGMAN_PROXY_CLUSTER_ROUTE_PEERS: node-a:6222,node-c:6222
      PGMAN_PROXY_POSTGRES_LOCAL_PG_ADDR: node-b:5432
    depends_on:
      node-a:
        condition: service_started
    ports:
      - "16433:6432"
      - "19091:9090"

  node-c:
    image: pgman-proxy-it:latest
    environment:
      <<: *cluster_common
      PGMAN_PROXY_NODE_ID: node-c
      PGMAN_PROXY_CLUSTER_ROUTE_PEERS: node-a:6222,node-b:6222
      PGMAN_PROXY_POSTGRES_LOCAL_PG_ADDR: node-c:5432
    depends_on:
      node-a:
        condition: service_started
    ports:
      - "16434:6432"
      - "19092:9090"
